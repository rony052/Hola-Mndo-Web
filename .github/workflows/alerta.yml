name: Alerta DevOps ITLA

on:
  push:
    branches:
      - main

jobs:
  notificacion:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificación a ntfy
        run: |
          curl \
            -H "Title: GitHub Actions - ITLA" \
            -H "Priority: default" \
            -H "Tags: github,devops" \
            -d "Se ha subido nuevo código al repositorio en la rama main." \
            https://ntfy.sh/devops-itla
